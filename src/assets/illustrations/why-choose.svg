<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0c1d37"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04979E"/>
      <stop offset="100%" stop-color="#015AAC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#wcBg)"/>

  <!-- diagonal pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="10">
    <line x1="0" y1="500" x2="500" y2="0"/>
    <line x1="60" y1="500" x2="500" y2="60"/>
    <line x1="120" y1="500" x2="500" y2="120"/>
    <line x1="0" y1="440" x2="440" y2="0"/>
  </g>

  <circle cx="250" cy="230" r="175" fill="#ffffff" opacity="0.04"/>
  <circle cx="250" cy="230" r="135" fill="#ffffff" opacity="0.05"/>

  <!-- shield -->
  <path d="M250 90 L350 128 L350 232 C350 305 305 350 250 372 C195 350 150 305 150 232 L150 128 Z" fill="url(#shieldGrad)"/>
  <path d="M250 110 L332 142 L332 230 C332 292 295 330 250 350 L250 110 Z" fill="#ffffff" opacity="0.08"/>

  <!-- heart + pulse inside shield -->
  <path d="M250 205 C250 185 280 175 292 195 C304 215 285 240 250 265 C215 240 196 215 208 195 C220 175 250 185 250 205 Z" fill="#ffffff"/>
  <polyline points="185,240 215,240 228,215 244,265 256,230 270,240 300,240" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small orbiting medical badges -->
  <g transform="translate(110,150)">
    <circle r="24" fill="#ffffff" opacity="0.9"/>
    <path d="M-8 0 h6 l3 -9 l4 18 l3 -9 h6" stroke="#04979E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(392,150)">
    <circle r="22" fill="#ffffff" opacity="0.9"/>
    <path d="M-3 -9 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 v-6 h6 z" fill="#ff6b6b"/>
  </g>
  <g transform="translate(392,340)">
    <circle r="22" fill="#ffffff" opacity="0.9"/>
    <path d="M0 -8 C4 -12 11 -9 11 -3 C11 4 0 11 0 11 C0 11 -11 4 -11 -3 C-11 -9 -4 -12 0 -8 Z" fill="#15cd72"/>
  </g>
  <g transform="translate(110,340)">
    <circle r="22" fill="#ffffff" opacity="0.9"/>
    <circle r="10" fill="none" stroke="#015AAC" stroke-width="3"/>
    <circle r="3" fill="#015AAC"/>
  </g>

  <!-- bottom trust badge with check -->
  <g transform="translate(250,430)">
    <rect x="-90" y="-24" width="180" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
    <circle cx="-58" cy="0" r="16" fill="#15cd72"/>
    <path d="M-64 0 l5 5 l10 -11" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
