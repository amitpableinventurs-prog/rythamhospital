    <circle cx="-3" cy="154" r="5" fill="#0a2540"/>
    <circle cx="0" cy="42" r="38" fill="#e7b490"/>
    <path d="M-34 32 C-34 4 34 4 34 32 C34 16 18 10 0 10 C-18 10 -34 16 -34 32 Z" fill="#2b2320"/>
    <circle cx="-13" cy="45" r="4" fill="#2b2320"/>
