<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="galleryStaffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d6fb8"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#galleryStaffBg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="30" cy="30" r="3"/><circle cx="50" cy="30" r="3"/><circle cx="50" cy="50" r="3"/><circle cx="30" cy="50" r="3"/>
  </g>
  <circle cx="200" cy="130" r="105" fill="#ffffff" opacity="0.06"/>

  <!-- doctor 1 -->
  <g transform="translate(150,120)">
    <circle cx="0" cy="-38" r="24" fill="#ffffff" opacity="0.95"/>
    <path d="M-40 55 C-40 5 -22 -12 0 -12 C22 -12 40 5 40 55 Z" fill="#ffffff" opacity="0.95"/>
    <rect x="-6" y="-6" width="12" height="30" fill="#0a2540" opacity="0.5"/>
  </g>

  <!-- doctor 2 -->
  <g transform="translate(250,128)">
    <circle cx="0" cy="-34" r="22" fill="#ffffff" opacity="0.8"/>
    <path d="M-36 52 C-36 6 -20 -10 0 -10 C20 -10 36 6 36 52 Z" fill="#ffffff" opacity="0.8"/>
    <rect x="-5" y="-4" width="10" height="26" fill="#0a2540" opacity="0.5"/>
  </g>

  <!-- stethoscope on doctor 1 -->
  <path d="M-14 -2 C-14 12 -2 14 -2 26 C-2 34 -10 38 -16 34" stroke="#0a2540" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="205" rx="120" ry="10" fill="#ffffff" opacity="0.12"/>

  <!-- small cross badge -->
  <g transform="translate(330,55)">
    <circle r="22" fill="#ffffff" opacity="0.95"/>
    <path d="M-3 -9 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 v-6 h6 z" fill="#1d6fb8"/>
  </g>
</svg>
