<svg width="500" height="420" viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04979E"/>
      <stop offset="100%" stop-color="#015AAC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="420" rx="20" fill="url(#aboutBg)"/>

  <!-- pattern -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="40" cy="40" r="3"/><circle cx="65" cy="40" r="3"/><circle cx="90" cy="40" r="3"/>
    <circle cx="40" cy="65" r="3"/><circle cx="65" cy="65" r="3"/><circle cx="90" cy="65" r="3"/>
  </g>

  <!-- sky glow -->
  <circle cx="250" cy="190" r="150" fill="#ffffff" opacity="0.06"/>

  <!-- ground -->
  <rect x="0" y="360" width="500" height="60" fill="#012f4d" opacity="0.25"/>

  <!-- side building -->
  <rect x="70" y="230" width="90" height="130" rx="6" fill="#e9f7f8"/>
  <g fill="#04979E">
    <rect x="84" y="248" width="14" height="14" rx="2"/>
    <rect x="112" y="248" width="14" height="14" rx="2"/>
    <rect x="140" y="248" width="14" height="14" rx="2"/>
    <rect x="84" y="276" width="14" height="14" rx="2"/>
    <rect x="112" y="276" width="14" height="14" rx="2"/>
    <rect x="140" y="276" width="14" height="14" rx="2"/>
    <rect x="84" y="304" width="14" height="14" rx="2"/>
    <rect x="140" y="304" width="14" height="14" rx="2"/>
  </g>
  <rect x="105" y="316" width="30" height="44" rx="3" fill="#015AAC"/>

  <!-- main hospital building -->
  <rect x="170" y="160" width="200" height="200" rx="8" fill="#ffffff"/>
  <rect x="170" y="160" width="200" height="30" rx="8" fill="#f0c419"/>
  <!-- cross on top band -->
  <g fill="#ff6b6b">
    <rect x="258" y="166" width="24" height="8" rx="2"/>
    <rect x="266" y="158" width="8" height="24" rx="2"/>
  </g>

  <!-- windows grid -->
  <g fill="#04979E" opacity="0.85">
    <rect x="190" y="210" width="26" height="26" rx="3"/>
    <rect x="230" y="210" width="26" height="26" rx="3"/>
    <rect x="284" y="210" width="26" height="26" rx="3"/>
    <rect x="324" y="210" width="26" height="26" rx="3"/>
    <rect x="190" y="252" width="26" height="26" rx="3"/>
    <rect x="230" y="252" width="26" height="26" rx="3"/>
    <rect x="284" y="252" width="26" height="26" rx="3"/>
    <rect x="324" y="252" width="26" height="26" rx="3"/>
  </g>

  <!-- entrance -->
  <rect x="248" y="296" width="44" height="64" rx="4" fill="#015AAC"/>
  <rect x="266" y="296" width="8" height="64" fill="#ffffff" opacity="0.5"/>
  <!-- awning -->
  <rect x="238" y="288" width="64" height="10" rx="3" fill="#0a2540"/>

  <!-- side building right -->
  <rect x="380" y="260" width="70" height="100" rx="6" fill="#e9f7f8"/>
  <g fill="#04979E">
    <rect x="392" y="276" width="12" height="12" rx="2"/>
    <rect x="414" y="276" width="12" height="12" rx="2"/>
    <rect x="392" y="300" width="12" height="12" rx="2"/>
    <rect x="414" y="300" width="12" height="12" rx="2"/>
    <rect x="392" y="324" width="12" height="12" rx="2"/>
    <rect x="414" y="324" width="12" height="12" rx="2"/>
  </g>

  <!-- ambulance small icon bottom left -->
  <g transform="translate(40,335)">
    <rect x="0" y="0" width="46" height="24" rx="4" fill="#ffffff"/>
    <rect x="34" y="4" width="14" height="16" rx="2" fill="#ffffff"/>
    <circle cx="12" cy="26" r="6" fill="#0a2540"/>
    <circle cx="38" cy="26" r="6" fill="#0a2540"/>
    <rect x="16" y="6" width="12" height="4" fill="#ff6b6b"/>
    <rect x="20" y="2" width="4" height="12" fill="#ff6b6b"/>
  </g>

  <!-- floating heartbeat line badge -->
  <g transform="translate(390,90)">
    <rect x="-46" y="-22" width="92" height="44" rx="22" fill="#ffffff" opacity="0.95"/>
    <polyline points="-30,0 -18,0 -10,-14 0,14 8,-6 16,0 30,0" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
